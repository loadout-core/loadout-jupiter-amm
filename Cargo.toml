[package]
name = "loadout-jupiter-amm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Jupiter AMM adapter for Loadout's pre-graduation bonding curves"
license = "Apache-2.0"
publish = false

[dependencies]
# Jupiter's interface and test kit come from the same commit, so the kit's `Amm` is this crate's.
jupiter-amm-interface = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "70f56e0495b7c818e4c38e37b2007656892ca2a1" }
# The bonding-curve and fee arithmetic used by the deployed program.
loadout-math = { path = "loadout-math" }
rust_decimal = "1.36"
solana-account = "4"
solana-instruction = "3.1"
solana-pubkey = { version = "4", features = ["curve25519"] }

[dev-dependencies]
jupiter-amm-test-kit = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "70f56e0495b7c818e4c38e37b2007656892ca2a1", default-features = false }
# The kit's generation of LiteSVM and Solana crates (see the kit's README on wincode).
litesvm = "0.14.0"
bincode = "1.3"
serde_json = "1"
solana-account = { version = "4", features = ["serde"] }
solana-clock = "3.1.1"
solana-compute-budget-interface = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["wincode"] }
# Test-only CPI relay uses the same runtime already locked by LiteSVM.
solana-program-runtime = { version = "=4.1.2", features = ["agave-unstable-api"] }
solana-instruction-error = "=2.4.0"
base64 = "=0.22.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }

[features]
# Explicit opt-in for fixture maintenance. Default tests cannot fetch accounts or programs.
fixture-rpc = ["jupiter-amm-test-kit/rpc"]

[workspace]
members = [".", "loadout-math"]

[[bench]]
name = "adapter"
harness = false
